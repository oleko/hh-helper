{% extends "base.html" %}
{% block title %}Вход — hh-helper{% endblock %}
{% block content %}
<div class="chart-wrap" style="max-width:22rem; margin:3rem auto 0;">
  <h2 style="margin-bottom:1.1rem;">Вход</h2>
  {% if error %}
  <p class="flags">⚠ {{ error }}</p>
  {% endif %}
  <form method="post">
    <p><input type="text" name="username" placeholder="Логин" autofocus autocomplete="username"
              style="width:100%;"></p>
    <p><input type="password" name="password" placeholder="Пароль" autocomplete="current-password"
              style="width:100%;"></p>
    <button type="submit" class="btn-primary" style="width:100%;">Войти</button>
  </form>
</div>
{% endblock %}
